# Lints the app target only. Test targets legitimately lean on force-unwraps/force-tries for
# fixture setup — that's an accepted, idiomatic convention in Swift test code, not a gap to close.
included:
  - TMinus

excluded:
  - .build

opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - todo
  # This codebase's established convention for multi-line signatures/closures puts the opening
  # brace on its own line rather than trailing the declaration — encoded here as the accepted
  # house style, not a gap.
  - opening_brace
  # This codebase's static factory methods (`static func initial(...)`, `static let ...`)
  # consistently construct the explicit type name rather than `Self` — encoded as the accepted
  # house style rather than fought file-by-file.
  - prefer_self_in_static_references

line_length:
  warning: 130
  error: 160
  ignores_comments: true
  ignores_urls: true

# The reducer+state pair for a paginated list screen (`LaunchListReducer`/`NewsListReducer`,
# `LaunchListState`/`NewsListState`) is this codebase's normal shape for that pattern — an
# exhaustive switch over every list action, and a response handler threading through
# mode and/or searchText, items, page, kind, error, and generation. `LaunchListReducer`/
# `LaunchListState` carry both mode *and* searchText (News only has the latter), one dimension
# wider than the rest of the pattern — thresholds are set to fit that established shape rather
# than flag it everywhere it deliberately recurs.
function_body_length:
  warning: 120
  error: 160

function_parameter_count:
  warning: 7
  error: 9

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 500
  ignore_comment_only_lines: true

cyclomatic_complexity:
  warning: 12
  error: 18

identifier_name:
  min_length: 2
  excluded:
    - id

# This codebase's established convention is a per-file/per-view `private enum Constants` that
# itself nests `Layout`/`Icon`/`AccessibilityID` sub-enums (see `LaunchCardView`, `NewsListView`,
# etc.), and `L10n` is a namespaced string catalog nested up to 3 levels deep by design
# (`L10n.Launches.Detail.rocket`). Both are deliberate, recurring structure, not a nesting smell.
nesting:
  type_level:
    warning: 3

# This codebase's convention is a trailing comma on every multi-line collection literal (see
# `LaunchesEndpoint`, `NewsEndpoint`, `TMinusApp`'s schema array) — enforced as present, not
# forbidden, to match.
trailing_comma:
  mandatory_comma: true

force_cast: error
force_try: error
force_unwrapping: warning
